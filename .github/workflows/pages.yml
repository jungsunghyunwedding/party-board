name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site with Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Secret 확인
          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL is empty"
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY is empty"
            exit 1
          fi

          # 배포 폴더 생성
          mkdir -p _site

          # 파일 복사
          cp -r ./* _site/

          # workflow 폴더는 제외
          rm -rf _site/.github

          # Secret 치환
          sed -i "s|__SUPABASE_URL__|$SUPABASE_URL|g" _site/index.html
          sed -i "s|__SUPABASE_ANON_KEY__|$SUPABASE_ANON_KEY|g" _site/index.html

          # 치환 확인
          if grep -q "__SUPABASE_URL__" _site/index.html; then
            echo "ERROR: SUPABASE_URL replacement failed"
            exit 1
          fi

          if grep -q "__SUPABASE_ANON_KEY__" _site/index.html; then
            echo "ERROR: SUPABASE_ANON_KEY replacement failed"
            exit 1
          fi

          echo "SUCCESS: Supabase secrets injected"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
