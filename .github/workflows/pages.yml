name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Supabase Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "=== CHECK SECRETS ==="

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL secret is empty"
            exit 1
          else
            echo "SUPABASE_URL exists"
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is empty"
            exit 1
          else
            echo "SUPABASE_ANON_KEY exists"
          fi

          echo "=== CHECK FILE ==="
          ls -la
          pwd

          echo "=== BEFORE ==="
          grep -n "SUPABASE_URL" index.html || true

          sed -i "s|__SUPABASE_URL__|$SUPABASE_URL|g" index.html
          sed -i "s|__SUPABASE_ANON_KEY__|$SUPABASE_ANON_KEY|g" index.html

          echo "=== AFTER ==="

          if grep -q "__SUPABASE_URL__" index.html; then
            echo "ERROR: URL replacement failed"
            exit 1
          fi

          echo "SUCCESS"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
