name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Create config.js from secrets
        run: |
          cat > config.js <<'EOF'
          window.SUPABASE_CONFIG = {
            url: "${{ secrets.SUPABASE_URL }}",
            anonKey: "${{ secrets.SUPABASE_ANON_KEY }}"
          };
          EOF

      - name: Verify config.js
        run: |
          test -f config.js
          grep "SUPABASE_CONFIG" config.js

          if grep -q 'url: ""' config.js; then
            echo "SUPABASE_URL is empty!"
            exit 1
          fi

          if grep -q 'anonKey: ""' config.js; then
            echo "SUPABASE_ANON_KEY is empty!"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
